<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Urban Cafe</title>

    <meta name="description"
        content="Login to your Urban Cafe customer account.">

    <link rel="icon" type="image/png" href="Images/cafe-icon.png">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container navbar">

            <a href="index.html" class="logo">
                Urban<span>Cafe</span>
            </a>

            <button
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Open menu"
            >
                ☰
            </button>

            <nav class="nav" id="main-nav">

                <a href="index.html">Home</a>

                <a href="about.html">About</a>

                <a href="menu.html">Menu</a>

                <a href="gallery.html">Gallery</a>

                <a href="contact.html">Contact</a>

            </nav>

            <a href="order.html" class="order-btn">
                Order Now
            </a>

        </div>

    </header>


    <!-- LOGIN -->

    <section class="auth-section">

        <div class="auth-card">

            <p class="section-tag">
                WELCOME BACK
            </p>

            <h1>
                Login
            </h1>

            <p class="auth-subtitle">
                Login to your Urban Cafe account.
            </p>


            <form id="login-form">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="btn primary-btn auth-btn"
                >
                    Login
                </button>

            </form>


            <!-- MESSAGE -->

            <p
                id="login-message"
                class="auth-message"
            ></p>


            <!-- REGISTER -->

            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <h3>
                UrbanCafe
            </h3>

            <p>
                Fresh coffee, delicious food and great moments.
            </p>

            <p>
                © 2026 Urban Cafe. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
